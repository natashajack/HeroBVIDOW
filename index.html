<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BVID OW Hero of the Day</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800&family=Rajdhani:wght@500;600;700&display=swap');

  :root{
    --bg-1:#1a2238; --bg-2:#0d1424;
    --panel:rgba(232,236,244,0.92);
    --panel-dark:rgba(20,28,46,0.82);
    --accent:#ff7a00; --accent-2:#36b6ff;
    --correct:#1f7a3d; --correct-d:#155c2c;
    --wrong:#8a1f24; --wrong-d:#6a161a;
    --text-dark:#16203a; --text-light:#f4f7ff;
    --radius:14px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    font-family:'Rajdhani',sans-serif;
    color:var(--text-light);
    min-height:100vh;
    background:
      radial-gradient(1200px 600px at 70% 20%, rgba(54,182,255,0.18), transparent 60%),
      radial-gradient(900px 500px at 20% 80%, rgba(255,122,0,0.16), transparent 60%),
      linear-gradient(160deg,var(--bg-1),var(--bg-2));
    background-attachment:fixed;
  }
  body::before{
    content:""; position:fixed; inset:0; pointer-events:none; opacity:.05;
    background-image:repeating-linear-gradient(0deg,#fff 0 1px,transparent 1px 4px);
  }
  .wrap{max-width:860px;margin:0 auto;padding:22px 16px 60px}

  /* nav */
  nav{
    background:var(--panel); color:var(--text-dark);
    border-radius:var(--radius); padding:18px 26px;
    display:flex;align-items:center;gap:28px;flex-wrap:wrap;
    box-shadow:0 10px 40px rgba(0,0,0,.45);
  }
  nav .logo{
    width:46px;height:46px;border-radius:50%;
    background:linear-gradient(135deg,var(--accent),#ff9d3d);
    display:grid;place-items:center;font-weight:800;color:#fff;
    font-family:'Orbitron';box-shadow:0 4px 14px rgba(255,122,0,.5);
  }
  nav .links{display:flex;flex-wrap:wrap;gap:14px 26px;font-family:'Orbitron';
    font-weight:600;font-size:15px;letter-spacing:.5px}
  nav .links span{cursor:pointer;transition:.15s;opacity:.85}
  nav .links span:hover{color:var(--accent);opacity:1}
  nav .links span.active{color:var(--accent)}
  nav .links span.title{font-family:'Orbitron';font-weight:800;font-size:22px;
    letter-spacing:.5px;color:var(--text-dark);cursor:default;opacity:1}
  nav .links span.title:hover{color:var(--text-dark)}

  /* mode buttons */
  .modes{display:flex;gap:18px;justify-content:center;margin:26px 0}
  .mode-btn{
    background:var(--panel);color:var(--text-dark);
    border:none;border-radius:var(--radius);padding:16px 40px;
    font-family:'Orbitron';font-weight:600;font-size:18px;cursor:pointer;
    display:flex;align-items:center;gap:12px;transition:.15s;
    box-shadow:0 8px 26px rgba(0,0,0,.4);
  }
  .mode-btn .ic{font-size:24px}
  .mode-btn.active{outline:3px solid var(--accent);transform:translateY(-2px)}
  .mode-btn:not(.active){opacity:.78}

  /* mystery card */
  .mystery{
    width:210px;margin:0 auto 0;background:#fff;border-radius:10px;
    overflow:hidden;box-shadow:0 10px 30px rgba(0,0,0,.45);
  }
  .mystery .face{background:#cfe0ff;height:170px;display:grid;place-items:center}
  .mystery .face .q{font-size:120px;color:#2b3450;font-family:'Orbitron';font-weight:800;line-height:1}
  .mystery .face img{width:100%;height:100%;object-fit:cover}
  .mystery .label{color:var(--text-dark);text-align:center;font-weight:700;
    font-size:22px;padding:14px;font-family:'Orbitron'}

  /* guess input */
  .guessbox{position:relative;margin:22px auto 0;max-width:680px}
  .guessbox input{
    width:100%;padding:18px 22px;font-size:20px;font-family:'Rajdhani';font-weight:600;
    border-radius:12px;border:3px solid var(--accent);outline:none;
    background:rgba(255,255,255,.96);color:var(--text-dark);
    box-shadow:0 8px 26px rgba(0,0,0,.35);
  }
  .guessbox input:disabled{border-color:#888;opacity:.7}
  .ac{
    position:absolute;left:0;right:0;top:calc(100% + 8px);z-index:30;
    display:flex;gap:10px;flex-wrap:wrap;justify-content:center;
  }
  .ac .opt{
    background:#fff;border:2px solid #e1e6f0;border-radius:8px;
    width:120px;cursor:pointer;overflow:hidden;transition:.12s;
    box-shadow:0 4px 12px rgba(0,0,0,.3);
  }
  .ac .opt:hover{border-color:var(--accent);transform:translateY(-3px)}
  .ac .opt .pf{height:96px;width:100%;object-fit:cover;display:block}
  .ac .opt .nm{color:var(--text-dark);font-weight:700;text-align:center;padding:8px 4px;font-size:15px}

  .hint{text-align:center;margin:20px 0;font-size:20px;font-weight:600;line-height:1.5;
    text-shadow:0 2px 8px rgba(0,0,0,.6)}

  /* rules legend */
  .rules{display:flex;align-items:center;gap:12px;justify-content:center;margin:26px 0 14px;
    font-family:'Orbitron';font-weight:600;font-size:18px}
  .pill{padding:6px 18px;border-radius:8px;font-size:16px}
  .pill.c{background:var(--correct)}.pill.w{background:var(--wrong)}

  /* guess table */
  .gtable{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:8px}
  .ghead,.grow{display:grid;grid-template-columns:1.3fr repeat(6,1fr);gap:6px}
  .ghead{background:var(--panel-dark);border-radius:10px;padding:4px}
  .ghead div{text-align:center;font-weight:700;font-family:'Orbitron';font-size:14px;
    padding:10px 2px;color:var(--text-light)}
  .grow .cell{
    border-radius:8px;display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:3px;padding:10px 4px;font-weight:700;font-size:16px;min-height:78px;text-align:center;
    animation:flip .5s ease both;
  }
  .grow .cell.name{background:#fff;color:var(--text-dark);font-family:'Orbitron';font-size:14px}
  .grow .cell.name img{width:54px;height:54px;border-radius:6px;object-fit:cover}
  .cell.correct{background:var(--correct)}
  .cell.wrong{background:var(--wrong)}
  .cell .ar{font-size:13px;opacity:.9}
  @keyframes flip{from{transform:rotateX(90deg);opacity:0}to{transform:rotateX(0);opacity:1}}
  .grow .cell:nth-child(2){animation-delay:.06s}
  .grow .cell:nth-child(3){animation-delay:.12s}
  .grow .cell:nth-child(4){animation-delay:.18s}
  .grow .cell:nth-child(5){animation-delay:.24s}
  .grow .cell:nth-child(6){animation-delay:.30s}
  .grow .cell:nth-child(7){animation-delay:.36s}

  .win{
    text-align:center;margin:24px auto;max-width:520px;background:var(--panel);
    color:var(--text-dark);border-radius:var(--radius);padding:24px;
    box-shadow:0 10px 30px rgba(0,0,0,.4);animation:flip .5s both;
  }
  .win h2{font-family:'Orbitron';color:var(--correct);font-size:26px;margin-bottom:6px}
  .win p{font-size:18px;margin-bottom:14px}
  .win button{background:var(--accent);color:#fff;border:none;padding:12px 28px;
    border-radius:10px;font-family:'Orbitron';font-weight:600;font-size:16px;cursor:pointer}

  /* leaderboard */
  .lb-entry{margin-top:16px;display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
  .lb-entry input{padding:10px 14px;font-size:16px;font-family:'Rajdhani';font-weight:600;
    border:2px solid var(--accent);border-radius:8px;outline:none;width:180px;color:var(--text-dark)}
  .lb-note{font-size:12px;opacity:.6;margin-top:8px}
  .leaderboard{max-width:520px;margin:22px auto;background:var(--panel);color:var(--text-dark);
    border-radius:var(--radius);padding:20px 24px;box-shadow:0 10px 30px rgba(0,0,0,.4)}
  .leaderboard h3{font-family:'Orbitron';font-size:20px;margin-bottom:4px;text-align:center}
  .leaderboard .date{text-align:center;font-size:13px;opacity:.6;margin-bottom:14px}
  .lb-list{display:flex;flex-direction:column;gap:6px}
  .lb-row{display:grid;grid-template-columns:36px 1fr auto;align-items:center;gap:10px;
    padding:9px 14px;border-radius:8px;background:rgba(22,32,58,.06);font-weight:600;font-size:16px}
  .lb-row.me{background:rgba(255,122,0,.18);outline:2px solid var(--accent)}
  .lb-row .rank{font-family:'Orbitron';font-weight:800;text-align:center}
  .lb-row .rank.r1{color:#d4a017}.lb-row .rank.r2{color:#9aa0b8}.lb-row .rank.r3{color:#b06a3a}
  .lb-row .turns{font-family:'Orbitron';font-size:14px;opacity:.8}
  .lb-empty{text-align:center;opacity:.6;padding:14px}
  .footer{text-align:center;margin-top:40px;opacity:.6;font-size:14px;font-family:'Orbitron'}
</style>
</head>
<body>
<div class="wrap">
  <nav>
    <div class="logo">HD</div>
    <div class="links">
      <span class="title">BVID OW Hero of the Day</span>
    </div>
  </nav>

  <div class="modes">
    <button class="mode-btn active" id="dailyBtn"><span class="ic">📜</span>Daily</button>
  </div>

    <div class="face"><div class="q" id="mysteryFace">?</div></div>

    <div class="ac" id="autocomplete"></div>
  </div>

  <div class="hint" id="hint">Take your first guess to get a clue.<br>Type "all" to list heroes.</div>

  <div id="rulesArea" style="display:none">
    <div class="rules">Rules: <span class="pill c">Correct</span><span class="pill w">Incorrect</span></div>
    <div class="gtable">
      <div class="ghead">
        <div>Hero</div><div>Gender</div><div>Role</div><div>Continent</div>

    <div class="lb-list" id="lbList"><div class="lb-empty">Loading…</div></div>
  </div>

  <div class="footer">BVID OW Hero of the Day · v1.0</div>
</div>

// generate a simple SVG avatar per hero (initial on colored circle)
function avatar(h){
  const init=h.name[0];
  const svg=`<svg xmlns='http://www.w3.org/2000/svg' width='120' height='120'>
    <defs><radialGradient id='g' cx='50%' cy='35%'>
      <stop offset='0%' stop-color='${h.c}'/><stop offset='100%' stop-color='#1a2238'/>
    </radialGradient></defs>
    <rect width='120' height='120' fill='url(#g)'/>
    <circle cx='60' cy='46' r='26' fill='rgba(255,255,255,.25)'/>
    <text x='60' y='58' font-family='Orbitron,sans-serif' font-size='34' font-weight='800'
      fill='#fff' text-anchor='middle'>${init}</text>
  </svg>`;
  return 'data:image/svg+xml;utf8,'+encodeURIComponent(svg);
}

let target=null, guesses=[], over=false, mode='daily';

// Get Y/M/D in America/Los_Angeles (auto-handles PST/PDT)
function ptParts(){
  const fmt=new Intl.DateTimeFormat('en-CA',{timeZone:'America/Los_Angeles',
    year:'numeric',month:'2-digit',day:'2-digit'});
  const p={}; fmt.formatToParts(new Date()).forEach(x=>{if(x.type!=='literal')p[x.type]=x.value;});
  return {y:+p.year,m:+p.month,d:+p.day};
}
// days since a fixed epoch, in PT — increments at midnight Pacific
function ptDayNumber(){
  const {y,m,d}=ptParts();
  return Math.floor(Date.UTC(y,m-1,d)/86400000);
}
// deterministic shuffle so the daily order looks random but is identical for everyone.
// Re-shuffles each full cycle so it doesn't repeat the same sequence forever.
function dailyHeroIndex(){
  const day=ptDayNumber();
  const n=ROSTER.length;
  const cycle=Math.floor(day/n);            // which pass through the roster
  const pos=((day%n)+n)%n;                   // position within this pass
  // build a shuffled order seeded by the cycle number (mulberry32 PRNG)
  let seed=2654435761^(cycle*2246822519);
  const rng=()=>{seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);
    t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};
  const order=[...Array(n).keys()];
  for(let i=n-1;i>0;i--){const j=Math.floor(rng()*(i+1));[order[i],order[j]]=[order[j],order[i]];}
  return order[pos];
}
function pickTarget(){
  return ROSTER[dailyHeroIndex()];
}

function cmp(g,t,key){
  if(key==='age'||key==='release'){
    if(g[key]===t[key]) return {cls:'correct',ar:''};
    return {cls:'wrong',ar: g[key]<t[key]?'▲':'▼'};
  }
  return g[key]===t[key]?{cls:'correct',ar:''}:{cls:'wrong',ar:''};
}

const rowsEl=document.getElementById('guessRows');
const rulesArea=document.getElementById('rulesArea');
const hintEl=document.getElementById('hint');
const input=document.getElementById('guessInput');
const ac=document.getElementById('autocomplete');

function render(){
  rowsEl.innerHTML='';
  if(guesses.length) rulesArea.style.display='block';
  guesses.forEach(name=>{
    const g=ROSTER.find(h=>h.name===name);
    const row=document.createElement('div'); row.className='grow';
    const fields=['gender','role','continent','species','age','release'];
    let html=`<div class="cell name"><img src="${avatar(g)}"><span>${g.name}</span></div>`;
    fields.forEach(f=>{
      const r=cmp(g,target,f);
      html+=`<div class="cell ${r.cls}">${g[f]}${r.ar?`<span class="ar">${r.ar}</span>`:''}</div>`;
    });
    row.innerHTML=html; rowsEl.appendChild(row);
  });
}

function makeGuess(name){
  if(over) return;
  const g=ROSTER.find(h=>h.name.toLowerCase()===name.toLowerCase());
  if(!g){hintEl.textContent='No hero by that name. Type "all" to list heroes.';return;}
  if(guesses.includes(g.name)) return;
  guesses.push(g.name); input.value=''; ac.innerHTML='';
  hintEl.style.display='none'; render();
  if(g.name===target.name) win();
}

function dayKey(){
  const {y,m,d}=ptParts();
  return `${y}-${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
}
const STORE_KEY=`lb:${dayKey()}`;
let myEntryId=null;

function win(){
  over=true; input.disabled=true;
  document.getElementById('mysteryFace').outerHTML=`<img src="${avatar(target)}">`;
  document.getElementById('mysteryLabel').textContent=target.name;
  const w=document.createElement('div'); w.className='win';
  w.innerHTML=`<h2>Solved!</h2><p>It was <b>${target.name}</b> in <b>${guesses.length}</b> ${guesses.length===1?'guess':'guesses'}.</p>
    <div class="lb-entry">
      <input type="text" id="nameInput" placeholder="Your name" maxlength="20">
      <button id="submitScore">Submit to Leaderboard</button>
    </div>
    <div class="lb-note">Your name and score will be visible to everyone who plays today.</div>`;
  rulesArea.parentNode.insertBefore(w,rulesArea.nextSibling);
  const ni=document.getElementById('nameInput');
  ni.focus();
  document.getElementById('submitScore').onclick=()=>submitScore(ni.value.trim());
  ni.addEventListener('keydown',e=>{if(e.key==='Enter')submitScore(ni.value.trim());});
}

async function submitScore(name){
  if(!name){const ni=document.getElementById('nameInput'); if(ni){ni.style.borderColor='#d64a6a';ni.placeholder='Enter a name first';} return;}
  const btn=document.getElementById('submitScore');
  if(btn){btn.disabled=true;btn.textContent='Saving…';}
  myEntryId='id_'+Math.random().toString(36).slice(2,9);
  const entry={id:myEntryId,name:name.slice(0,20),turns:guesses.length,ts:Date.now()};
  try{
    let board=await loadBoard();
    board.push(entry);
    await window.storage.set(STORE_KEY, JSON.stringify(board), true);
  }catch(err){ console.error(err); }
  const entryUI=document.querySelector('.lb-entry');
  if(entryUI) entryUI.outerHTML='<p style="font-size:15px;opacity:.7;margin-top:8px">Score submitted! Come back tomorrow for a new hero.</p>';
  renderBoard();
}

async function loadBoard(){
  try{
    const r=await window.storage.get(STORE_KEY, true);
    return r&&r.value?JSON.parse(r.value):[];
  }catch(err){ return []; }
}

async function renderBoard(){
  const listEl=document.getElementById('lbList');
  document.getElementById('lbDate').textContent=dayKey();
  let board=await loadBoard();
  if(!board.length){ listEl.innerHTML='<div class="lb-empty">No scores yet today — be the first!</div>'; return; }
  board.sort((a,b)=> a.turns-b.turns || a.ts-b.ts);
  listEl.innerHTML='';
  board.forEach((e,i)=>{
    const row=document.createElement('div');
    row.className='lb-row'+(e.id===myEntryId?' me':'');
    const rc=i===0?'r1':i===1?'r2':i===2?'r3':'';
    const medal=i===0?'🥇':i===1?'🥈':i===2?'🥉':(i+1);
    row.innerHTML=`<div class="rank ${rc}">${medal}</div>
      <div class="nm">${escapeHtml(e.name)}</div>
      <div class="turns">${e.turns} ${e.turns===1?'turn':'turns'}</div>`;
    listEl.appendChild(row);
  });
}
function escapeHtml(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}

input.addEventListener('input',()=>{
  const v=input.value.trim().toLowerCase();
  ac.innerHTML='';
  if(v==='all'){ showOpts(ROSTER); return; }
  if(!v) return;
  const matches=ROSTER.filter(h=>h.name.toLowerCase().startsWith(v) && !guesses.includes(h.name)).slice(0,5);
  showOpts(matches);
});
function showOpts(list){
  ac.innerHTML='';
  list.forEach(h=>{
    const o=document.createElement('div');o.className='opt';
    o.innerHTML=`<img class="pf" src="${avatar(h)}"><div class="nm">${h.name}</div>`;
    o.onclick=()=>makeGuess(h.name);
    ac.appendChild(o);
  });
}
input.addEventListener('keydown',e=>{
  if(e.key==='Enter'){
    const first=ac.querySelector('.opt .nm');
    if(first) makeGuess(first.textContent);
    else makeGuess(input.value.trim());
  }
});

document.getElementById('dailyBtn').onclick=()=>{};

target=pickTarget();
renderBoard();
</script>
